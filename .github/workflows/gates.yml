# The gates that guard this plugin, run on every push.
#
# They already exist as npm scripts and were run by hand throughout development, which is exactly
# the problem: a check that only runs when someone remembers is a check that stops running. Several
# of them earn their keep only because they were confirmed to fail first — the story smoke test
# catches a component that renders nothing, and the placement check catches a popover sliding under
# the sidebar. Neither is visible to a type checker.
#
# Lint is deliberately report-only. The repository carries a known baseline rather than zero, so
# failing the build on it would mean either a permanently red pipeline or a rush of unrelated
# changes to clear it. The count is printed so a regression is still visible in the log.
#
# On why the release workflow beside this one had never run: two release tags were pushed and
# produced nothing, while the first push that carried this file triggered immediately. Actions was
# enabled the whole time, so the fork's status was not the cause. The likeliest explanation is that
# the repository had never activated Actions at all and the first branch push did it — but that is
# a guess, and the honest test is whether the next release tag produces a run. If it does not, add
# workflow_dispatch to the release workflow rather than assuming the trigger is sound.

name: Gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser-driven checks use the system Chrome rather than downloading one, matching how
      # they run locally. The runner image ships it, so this only has to point at it.
      - name: Locate Chrome
        run: echo "SCREENSHOT_CHROME=$(which google-chrome || which chromium-browser)" >> "$GITHUB_ENV"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build plugin
        run: npm run build

      - name: Unit tests
        run: npx vitest run

      - name: Capture staleness
        run: npm run screenshots:verify

      - name: DOM shim behaviour
        run: npm run storybook:verify

      - name: Shim and stub cover the source
        run: npm run shim:coverage

      - name: Popover and sheet geometry
        run: npm run storybook:placement

      - name: Build catalogue
        run: npm run build-storybook

      - name: Story coverage
        run: npm run story:coverage

      - name: Story smoke
        run: npm run story:smoke

      - name: Render bench
        run: npm run bench

      - name: Comment banners
        run: node tools/naming/scan-comments.mjs

      - name: Naming
        run: node tools/naming/scan-naming.mjs

      - name: Folder docs
        run: node tools/naming/scan-folder-docs.mjs

      - name: Lint (report-only)
        run: npm run lint || true

      # A build that leaves the tree dirty means a generated artifact is tracked but not committed,
      # which is how a stale bundle ships while every check above stays green.
      #
      # `main.js` is the one tracked file this rule cannot hold to that standard on every push.
      # It is committed only by a release commit (`chore(release): ...`); every commit in between
      # ships whatever bundle the last release produced, so a `src/` change since that release makes
      # a fresh build differ from the committed one by design, not by accident. Failing the gate on
      # that difference would force every ordinary commit to also commit a bundle nobody ships from
      # it — the tagged release rebuilds its own in the separate release workflow, and that build,
      # not this tree's `main.js`, is what gets uploaded and attested. So `main.js` is excluded from
      # this check except on a release commit, where the committed bundle must still match what
      # `src/` actually produces.
      - name: Working tree is clean after a full run
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == chore\(release\):* ]]; then
            pathspec=(".")
          else
            pathspec=("." ":!main.js")
          fi
          dirty="$(git status --porcelain -- "${pathspec[@]}")"
          if [ -n "$dirty" ]; then
            echo "::error::the gate run modified tracked files:"
            echo "$dirty"
            git diff --stat -- "${pathspec[@]}"
            exit 1
          fi
          echo "tree clean"
